<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Farmer Query Support</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-brand">
        <h1><i class="fas fa-leaf"></i> Farmer Query Support</h1>
      </div>
      <div class="navbar-menu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link">Login</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="auth-container">
      <h2>Create Account</h2>
      
      <div id="alertMessage" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number (Optional)</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" minlength="10" maxlength="10" pattern="^[6-9][0-9]{9}$" title="Phone number must be exactly 10 digits and start with 6, 7, 8, or 9">
        </div>

        <div class="form-group">
          <label for="state">State/Province</label>
          <input type="text" id="state" name="state" required>
        </div>

        <div class="form-group">
          <label for="role">User Type</label>
          <select id="role" name="role" required>
            <option value="">Select your role</option>
            <option value="farmer">Farmer</option>
            <option value="officer">Agricultural Officer</option>
          </select>
        </div>

        <div class="form-group" id="farmerFields" style="display: none;">
          <label for="cropType">Primary Crop Type (Optional)</label>
          <input type="text" id="cropType" name="cropType" placeholder="e.g., Rice, Wheat, Corn">
        </div>

        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/v1';

    // Show/hide farmer fields based on role selection
    document.getElementById('role').addEventListener('change', (e) => {
      const farmerFields = document.getElementById('farmerFields');
      farmerFields.style.display = e.target.value === 'farmer' ? 'block' : 'none';
    });

    // Handle registration form submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const phoneNumber = document.getElementById('phoneNumber').value;
      const state = document.getElementById('state').value;
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validate passwords match
      if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
      }

      // Validate phone number format if provided
      if (phoneNumber && !/^[6-9]\d{9}$/.test(phoneNumber)) {
        showAlert('Phone number must be exactly 10 digits and start with 6, 7, 8, or 9', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            phoneNumber: phoneNumber || undefined,
            state,
            role,
            password,
            confirmPassword,
          }),
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Please verify your email.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showAlert(data.message || 'Registration failed', 'error');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    });

    function showAlert(message, type) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.textContent = message;
      alertDiv.className = `alert alert-${type} show`;
      setTimeout(() => {
        alertDiv.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
