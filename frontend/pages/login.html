<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Farmer Query Support</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-brand">
        <h1><i class="fas fa-leaf"></i> Farmer Query Support</h1>
      </div>
      <div class="navbar-menu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="register.html" class="nav-link">Register</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="auth-container">
      <h2>Login</h2>
      
      <div id="alertMessage" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="auth-link">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/v1';

    // Check if already logged in and redirect
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token') || localStorage.getItem('accessToken');
      const userStr = localStorage.getItem('user');
      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          if (user && user.role) {
            let dashboardUrl = 'farmer-dashboard.html';
            if (user.role === 'officer') {
              dashboardUrl = 'officer-dashboard.html';
            } else if (user.role === 'admin') {
              dashboardUrl = 'admin-dashboard.html';
            }
            showAlert('Already logged in. Redirecting to dashboard...', 'success');
            setTimeout(() => {
              window.location.href = dashboardUrl;
            }, 1000);
          }
        } catch (e) {
          console.error('Error parsing user:', e);
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Store token and user info
          localStorage.setItem('accessToken', data.accessToken);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showAlert('Login successful!', 'success');
          
          // Redirect based on role
          const userRole = data.user.role;
          setTimeout(() => {
            if (userRole === 'farmer') {
              window.location.href = 'farmer-dashboard.html';
            } else if (userRole === 'officer') {
              window.location.href = 'officer-dashboard.html';
            } else if (userRole === 'admin') {
              window.location.href = 'admin-dashboard.html';
            }
          }, 1500);
        } else {
          showAlert(data.message || 'Login failed', 'error');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    });

    function showAlert(message, type) {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.textContent = message;
      alertDiv.className = `alert alert-${type} show`;
      setTimeout(() => {
        alertDiv.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
